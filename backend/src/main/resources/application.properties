
# Application
spring.application.name=PenxAgent
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/penxagent
spring.datasource.username=penxagent
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Initial administrator setup
penxagent.setup.enabled=${PENXAGENT_SETUP_ENABLED:false}
penxagent.setup.secret=${PENXAGENT_SETUP_SECRET:}

# Session security
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict